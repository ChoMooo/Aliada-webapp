<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Aliada Digital</title>
    <meta name="description" content="Tu plata, tus inversiones y el mundo digital, a tu ritmo y con calma." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1310" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aliada" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  </head>
  <body>
    <!-- Pantalla de carga: la animación del logo (video sin sonido, 2,8 s). Se va cuando termina y la app ya cargó. -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#052629 0,#03191c 32vmax,#010c0e 75vmax);transition:opacity .45s ease,visibility .45s}
      #splash.out{opacity:0;visibility:hidden}
      #splash .sp-box{position:relative;width:min(92vw,62vh,460px);aspect-ratio:1;transition:transform .5s cubic-bezier(.22,1,.36,1)}
      #splash.out .sp-box{transform:scale(1.05)}
      #splash video,#splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 84%,transparent 100%);mask-image:radial-gradient(closest-side,#000 84%,transparent 100%)}
      #splash img{opacity:0;transition:opacity .4s}
      #splash.static img{opacity:1}#splash.static video{opacity:0}
    </style>
    <div id="splash" role="img" aria-label="Aliada Digital">
      <div class="sp-box">
        <video id="sp-v" muted playsinline autoplay preload="auto" disablepictureinpicture poster="intro/logo-poster.webp">
          <source src="intro/logo.webm" type="video/webm" />
          <source src="intro/logo.mp4" type="video/mp4" />
        </video>
        <img src="intro/logo-final.webp" alt="" />
      </div>
    </div>
    <script>
      window.__errs = [];
      window.addEventListener('error', function (e) { window.__errs.push(String(e.message || e.error || 'error')); });
      window.addEventListener('unhandledrejection', function (e) { window.__errs.push(String(e.reason && e.reason.message || e.reason)); });
      (function () {
        var el = document.getElementById('splash'), v = document.getElementById('sp-v'), done = false, ready = false, ended = false, t0 = Date.now();
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        function hide() {
          if (done || !el) return;
          var root = document.getElementById('root');
          if (root && !root.children.length) { // la app todavía no se dibujó
            if (!window.__errs.length && Date.now() - t0 < 15000) { setTimeout(hide, 300); return; }
            // no llegó a abrirse: mejor un aviso que una pantalla en blanco
            done = true;
            el.classList.add('static');
            var box = document.createElement('div');
            box.style.cssText = 'position:absolute;left:16px;right:16px;bottom:8vh;text-align:center;color:#e6f4ec;font:16px/1.45 system-ui,sans-serif';
            box.innerHTML = '<b style="font-size:18px">No se pudo abrir la app</b><br>Tocá para volver a intentar.<br><small style="opacity:.6;word-break:break-all"></small>';
            box.querySelector('small').textContent = (window.__errs || []).slice(0, 2).join(' · ');
            el.appendChild(box); el.onclick = function () { location.reload(); };
            return;
          }
          done = true; el.classList.add('out'); setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 500); }
        function check() { if (ready && ended) setTimeout(hide, 150); }
        function fin() { if (!ended) { ended = true; check(); } }
        window.__splash = { ready: function () { ready = true; check(); }, until: function () { return done ? 0 : Math.max(0, 3000 - (Date.now() - t0)); } };
        el.addEventListener('click', function () { if (!done) { ready = true; fin(); hide(); } });
        if (reduce) { el.classList.add('static'); try { v.pause(); } catch (e) {} setTimeout(fin, 700); return; }
        v.muted = true; v.defaultMuted = true;
        v.addEventListener('ended', fin);
        var p = v.play && v.play(); if (p && p.catch) p.catch(function () { el.classList.add('static'); setTimeout(fin, 900); });
        setTimeout(function () { if (v.paused || v.currentTime === 0) { el.classList.add('static'); setTimeout(fin, 900); } }, 900);
        setTimeout(fin, 3300);
        setTimeout(function () { ready = true; fin(); }, 12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
